name: Reminder tests

on:
  pull_request:
    paths:
      - 'swift-app/**'
      - 'scripts/test-reminder-panel.sh'
      - '.github/workflows/reminder-tests.yml'
  push:
    branches: [main]
    paths:
      - 'swift-app/**'

jobs:
  reminder-panel:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reminder panel
        run: ./scripts/test-reminder-panel.sh
